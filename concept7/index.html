<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>낫 든 사신 — 참고 그림 기준 3안</title><style>body{margin:0;font-family:"Malgun Gothic",system-ui,sans-serif;background:#141633;color:#eef;line-height:1.6}main{max-width:1200px;margin:auto;padding:20px}h1{color:#ffd84d;margin:0 0 6px}h2{color:#8fd3ff;margin:26px 0 8px}p{color:#c6caf0;margin:4px 0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#1e2150;border-radius:16px;padding:12px}.card img,.card video{width:100%;border-radius:12px}h3{color:#ffd84d;margin:6px 0 0;font-size:17px}</style></head><body><main><h1>낫 든 사신 — 참고 그림 기준 3안</h1><p>2026년 11월 25일. 보내 주신 참고 그림(검은 두건·금 장식·보랏빛 눈)을 기준으로 다시 그린 시안입니다 (OpenAI gpt-image-2 생성, 실제 게임 화면 아님). 하나를 고르면 Meshy로 3D 모델로 바꿔 게임에 넣습니다.</p><div class=row><div class=card><img src='reaper_a.jpg' alt='A'><h3>A. 참고 그림 그대로</h3><p>검은 얼굴에 보랏빛 눈, 금 장식 두건, 초승달 낫</p></div><div class=card><img src='reaper_b.jpg' alt='B'><h3>B. 사신 왕</h3><p>초승달 왕관, 높은 깃과 넓게 펼친 망토, 날이 두 개인 낫</p></div><div class=card><img src='reaper_c.jpg' alt='C'><h3>C. 표정이 보이는 안</h3><p>같은 옷에 흰자 있는 큰 눈과 눈썹, 두건 끝 별 장식</p></div></div></main></body></html>
